<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5cab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Photo Location Stamp</title>
<style>
  * { box-sizing: border-box; }
  html { font-size: 22px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
    background: #f4f7fb; color: #111; font-size: 1rem; line-height: 1.4;
    overflow-x: hidden; word-wrap: break-word;
  }
  header { background: #0b5cab; color: #fff; padding: .7rem .8rem .8rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.45rem; line-height: 1.2; }
  header p { margin: .15rem 0 0; font-size: 1rem; }
  .row { display: flex; justify-content: center; align-items: center; gap: .6rem; flex-wrap: wrap; margin-top: .5rem; }
  #net { padding: .1rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 700; background: #fff; color: #0a6b2c; }
  #net.off { color: #a15c00; }
  .size { display: flex; align-items: center; gap: .4rem; font-size: .8rem; }
  .size button {
    min-width: 2.6rem; height: 2.6rem; border: 2px solid #fff; border-radius: .6rem; background: transparent;
    color: #fff; font-size: 1.1rem; font-weight: 800; font-family: inherit;
  }
  main { max-width: 640px; margin: 0 auto; padding: .8rem; }
  .btn {
    display: block; width: 100%; min-height: 4.2rem; margin: .7rem 0; padding: .7rem 1rem;
    border: 0; border-radius: 1rem; font-size: 1.2rem; font-weight: 700; text-align: center;
    color: #fff; cursor: pointer; font-family: inherit; line-height: 1.25;
  }
  .btn small { display: block; font-size: .9rem; font-weight: 500; }
  .btn:active { transform: scale(.98); }
  .blue { background: #0b5cab; }
  .green { background: #1a7f37; }
  .orange { background: #b45309; }
  .grey { background: #4b5563; }
  input[type=file] { display: none; }
  #status {
    background: #fff; border: 3px solid #cfd8e3; border-radius: .8rem; padding: .8rem;
    font-size: 1.05rem; margin: .8rem 0; min-height: 3.2rem;
  }
  #status small { font-size: .85rem; }
  #status.ok { border-color: #1a7f37; }
  #status.warn { border-color: #b45309; }
  #status.err { border-color: #b91c1c; }
  #preview { width: 100%; height: auto; border-radius: .7rem; display: none; background: #ddd; }
  .hidden { display: none !important; }
  #cam { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; flex-direction: column; padding: .5rem; }
  #cam video { flex: 1; min-height: 0; width: 100%; object-fit: cover; border-radius: .7rem; background: #222; }
  #camMsg { color: #fff; text-align: center; font-size: .95rem; padding: .4rem .2rem; }
  #cam .btn { margin: .3rem 0; min-height: 3.6rem; }
  .install {
    display: inline-block; margin-top: .6rem; padding: .5rem 1.1rem; min-height: 2.6rem;
    border: 0; border-radius: 999px; background: #f97316; color: #111;
    font-size: .9rem; font-weight: 800; font-family: inherit;
  }
  footer { text-align: center; color: #555; font-size: .8rem; padding: 1rem .8rem 1.8rem; }
</style>
</head>
<body>
<header>
  <h1>📍 Photo Location Stamp</h1>
  <p>फोटो पर जगह लिखें</p>
  <div class="row"><span id="net">Online</span><span class="size">Text size / अक्षर: <button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Bigger text">A+</button></span></div>
  <button id="installBtn" class="install hidden">⬇️ Install App / ऐप इंस्टॉल करें</button>
</header>

<main>
  <button id="camBtn" class="btn blue">
    📷 Take Photo with Camera
    <small>फोटो खींचें</small>
  </button>

  <label class="btn blue" for="file">
    🖼️ Choose Photo from Gallery
    <small>गैलरी से फोटो चुनें</small>
  </label>
  <input id="file" type="file" accept="image/jpeg,image/*">

  <label id="fbLabel" class="btn grey hidden" for="camFallback">
    Use phone's camera app
    <small>फोन का कैमरा ऐप खोलें</small>
  </label>
  <input id="camFallback" type="file" accept="image/*" capture="environment">

  <div id="status">Tap the blue button to start.<br>शुरू करने के लिए नीला बटन दबाएं।</div>

  <canvas id="preview"></canvas>

  <button id="gpsBtn" class="btn orange hidden">
    Use my current location
    <small>अभी की मेरी जगह लगाएं</small>
  </button>

  <button id="saveBtn" class="btn green hidden">
    2. Save Photo
    <small>फोटो सेव करें</small>
  </button>

  <button id="shareBtn" class="btn grey hidden">
    Share / Save to Gallery
    <small>शेयर करें / गैलरी में सेव करें</small>
  </button>
</main>

<footer>No ads. Your photo never leaves your phone.<br>कोई विज्ञापन नहीं। आपकी फोटो फोन में ही रहती है।</footer>

<div id="cam" class="hidden">
  <video id="vid" playsinline muted autoplay></video>
  <div id="camMsg"></div>
  <button id="shootBtn" class="btn green">
    📷 Click Picture
    <small>फोटो खींचें</small>
  </button>
  <button id="camCancel" class="btn grey">Cancel / रद्द करें</button>
</div>

<script src="exif.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fileInput = $('file'), statusEl = $('status'), canvas = $('preview');
  const gpsBtn = $('gpsBtn'), saveBtn = $('saveBtn'), shareBtn = $('shareBtn'), net = $('net');
  const ctx = canvas.getContext('2d');

  // ---- Text size (remembered) ----
  const SIZES = [18, 22, 26, 30, 34];
  let sizeIdx = 1;
  try { const s = parseInt(localStorage.getItem('sizeIdx'), 10); if (s >= 0 && s < SIZES.length) sizeIdx = s; } catch (e) {}
  function applySize() {
    document.documentElement.style.fontSize = SIZES[sizeIdx] + 'px';
    try { localStorage.setItem('sizeIdx', sizeIdx); } catch (e) {}
  }
  applySize();
  $('bigger').addEventListener('click', () => { if (sizeIdx < SIZES.length - 1) { sizeIdx++; applySize(); } });
  $('smaller').addEventListener('click', () => { if (sizeIdx > 0) { sizeIdx--; applySize(); } });



  // ---- Install button (no need to use browser menu) ----
  const installBtn = $('installBtn');
  let deferredInstall = null;
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredInstall = e;
    if (!standalone) installBtn.classList.remove('hidden');
  });
  addEventListener('appinstalled', () => {
    deferredInstall = null;
    installBtn.classList.add('hidden');
    setStatus('<b>App installed ✔</b> Look for it on your home screen.<br>ऐप इंस्टॉल हो गया। होम स्क्रीन पर देखें।', 'ok');
  });
  if (isIOS && !standalone) installBtn.classList.remove('hidden');
  installBtn.addEventListener('click', async () => {
    if (deferredInstall) {
      deferredInstall.prompt();
      try { await deferredInstall.userChoice; } catch (e) {}
      deferredInstall = null;
      installBtn.classList.add('hidden');
    } else if (isIOS) {
      setStatus('<b>iPhone:</b> tap the Share button <b>⬆</b> at the bottom of Safari, then choose <b>"Add to Home Screen"</b>.<br>शेयर बटन ⬆ दबाएं, फिर "Add to Home Screen" चुनें।', 'warn');
    }
  });

  let bitmap = null, fileName = 'photo', info = null, blob = null;

  function setStatus(html, cls) {
    statusEl.className = cls || '';
    statusEl.innerHTML = html;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function updateNet() {
    net.textContent = navigator.onLine ? 'Online' : 'Offline (works fine)';
    net.className = navigator.onLine ? '' : 'off';
  }
  addEventListener('online', updateNet);
  addEventListener('offline', updateNet);
  updateNet();

  function fmtDate(exifDate) {
    const m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/.exec(exifDate || '');
    if (!m) return '';
    const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
    return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function fmtCoords(lat, lon) {
    return Math.abs(lat).toFixed(6) + '° ' + (lat >= 0 ? 'N' : 'S') + ', ' +
           Math.abs(lon).toFixed(6) + '° ' + (lon >= 0 ? 'E' : 'W');
  }

  async function placeName(lat, lon) {
    if (!navigator.onLine) return '';
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 7000);
    try {
      const url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=en&lat=' +
                  lat + '&lon=' + lon;
      const r = await fetch(url, { signal: ctl.signal });
      const j = await r.json();
      return j.display_name || '';
    } catch (e) {
      return '';
    } finally {
      clearTimeout(timer);
    }
  }

  function wrap(text, maxW) {
    const words = text.split(/\s+/), lines = [];
    let cur = '';
    for (const w of words) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function draw() {
    if (!bitmap) return;
    const MAX = 3000;
    const scale = Math.min(1, MAX / Math.max(bitmap.width, bitmap.height));
    const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
    canvas.width = w; canvas.height = h;
    ctx.drawImage(bitmap, 0, 0, w, h);

    if (info && info.lat != null) {
      const fs = Math.max(18, Math.round(w / 34));
      const lh = Math.round(fs * 1.3), pad = Math.round(fs * 0.7);
      ctx.font = '700 ' + fs + 'px system-ui, Arial, sans-serif';
      const maxW = w - pad * 2;

      let lines = [];
      if (info.place) lines = lines.concat(wrap(info.place, maxW));
      lines.push('Lat/Lon: ' + fmtCoords(info.lat, info.lon));
      if (info.date) lines.push(info.date);

      const barH = lines.length * lh + pad * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, h - barH, w, barH);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'top';
      lines.forEach((t, i) => ctx.fillText(t, pad, h - barH + pad + i * lh));
    }
    canvas.style.display = 'block';
  }

  async function finish() {
    setStatus('Adding location to photo…<br>फोटो पर जगह लिखी जा रही है…');
    if (info.place === undefined) info.place = await placeName(info.lat, info.lon);
    draw();
    blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
    saveBtn.classList.remove('hidden');
    if (navigator.canShare && blob) {
      const f = new File([blob], outName(), { type: 'image/jpeg' });
      if (navigator.canShare({ files: [f] })) shareBtn.classList.remove('hidden');
    }
    gpsBtn.classList.add('hidden');
    let msg = '<b>Done! ✔</b> Location added to the photo.<br>हो गया! फोटो पर जगह लिख दी गई है।';
    if (!info.place) {
      msg += '<br><small>Place name needs internet; GPS numbers were added.<br>जगह का नाम इंटरनेट से आता है; अभी GPS नंबर लगाए हैं।</small>';
    }
    setStatus(msg, 'ok');
    saveBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function outName() {
    const base = fileName.replace(/\.[^.]+$/, '').slice(0, 40) || 'photo';
    return base + '-location.jpg';
  }

  async function handleFile(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    saveBtn.classList.add('hidden'); shareBtn.classList.add('hidden'); gpsBtn.classList.add('hidden');
    canvas.style.display = 'none'; blob = null; info = null;
    fileName = file.name || 'photo';
    setStatus('Reading photo…<br>फोटो पढ़ रहे हैं…');
    try {
      const buf = await file.arrayBuffer();
      const exif = readExif(buf);
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      info = { lat: exif.lat, lon: exif.lon, date: fmtDate(exif.date), place: undefined };
      if (info.lat != null) {
        await finish();
      } else {
        draw();
        gpsBtn.classList.remove('hidden');
        setStatus(
          '<b>This photo has no location saved.</b><br>' +
          'Some apps (like WhatsApp) remove it. If you are at the place where the photo was taken, tap the orange button.<br><br>' +
          'इस फोटो में जगह नहीं मिली। अगर आप उसी जगह पर हैं तो नारंगी बटन दबाएं।', 'warn');
      }
    } catch (e) {
      bitmap = null;
      setStatus('<b>Sorry, this photo cannot be opened.</b><br>Please choose a normal JPG photo.<br>यह फोटो नहीं खुल सकी। कृपया दूसरी फोटो चुनें।', 'err');
    }
  }
  fileInput.addEventListener('change', () => handleFile(fileInput));
  $('camFallback').addEventListener('change', () => handleFile($('camFallback')));

  // ---- In-app camera ----
  const cam = $('cam'), vid = $('vid'), camMsg = $('camMsg');
  const shootBtn = $('shootBtn'), camCancel = $('camCancel'), camBtn = $('camBtn'), fbLabel = $('fbLabel');
  let stream = null, watchId = null, lastPos = null;

  function nowStr() {
    return new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (watchId != null && navigator.geolocation) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    vid.srcObject = null;
    cam.classList.add('hidden');
  }

  function startLocationWatch() {
    lastPos = null;
    camMsg.textContent = 'Finding location… / जगह ढूंढ रहे हैं…';
    if (!navigator.geolocation) { camMsg.textContent = 'Location not available / लोकेशन उपलब्ध नहीं'; return; }
    watchId = navigator.geolocation.watchPosition(p => {
      lastPos = p;
      camMsg.textContent = 'Location ready ✔ / जगह मिल गई ✔';
    }, () => {
      camMsg.textContent = 'Location not found. Please switch on Location. / लोकेशन चालू करें';
    }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  }

  camBtn.addEventListener('click', async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('camFallback').click();
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3000 }, height: { ideal: 3000 } },
        audio: false
      });
    } catch (e) {
      fbLabel.classList.remove('hidden');
      setStatus('<b>Camera is not allowed.</b><br>Please allow the camera when asked, or tap the grey button below to use the phone camera app.<br>कैमरे की अनुमति दें, या नीचे के बटन से फोन का कैमरा ऐप खोलें।', 'warn');
      return;
    }
    vid.srcObject = stream;
    cam.classList.remove('hidden');
    startLocationWatch();
    try { await vid.play(); } catch (e) { /* autoplay handled by attribute */ }
  });

  camCancel.addEventListener('click', stopCamera);

  shootBtn.addEventListener('click', async () => {
    if (!vid.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = vid.videoWidth; c.height = vid.videoHeight;
    c.getContext('2d').drawImage(vid, 0, 0);
    let pos = lastPos;
    const when = nowStr();
    stopCamera();

    saveBtn.classList.add('hidden'); shareBtn.classList.add('hidden'); gpsBtn.classList.add('hidden');
    canvas.style.display = 'none'; blob = null; info = null;
    fileName = 'camera-' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
    bitmap = await createImageBitmap(c);

    if (!pos && navigator.geolocation) {
      setStatus('Finding your location…<br>जगह ढूंढ रहे हैं…');
      pos = await new Promise(res => navigator.geolocation.getCurrentPosition(res, () => res(null), { enableHighAccuracy: true, timeout: 10000 }));
    }
    if (pos) {
      info = { lat: pos.coords.latitude, lon: pos.coords.longitude, date: when, place: undefined };
      await finish();
    } else {
      info = { lat: undefined, lon: undefined, date: when, place: undefined };
      draw();
      gpsBtn.classList.remove('hidden');
      setStatus('<b>Could not find location.</b><br>Switch on Location in phone settings, then tap the orange button.<br>लोकेशन चालू करें, फिर नारंगी बटन दबाएं।', 'warn');
    }
  });

  gpsBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      setStatus('Location is not available on this phone.<br>इस फोन में लोकेशन उपलब्ध नहीं है।', 'err');
      return;
    }
    setStatus('Finding your location… please allow when asked.<br>जगह ढूंढ रहे हैं… पूछने पर "अनुमति दें" दबाएं।');
    navigator.geolocation.getCurrentPosition(async pos => {
      info.lat = pos.coords.latitude; info.lon = pos.coords.longitude;
      info.place = undefined;
      if (!info.date) info.date = new Date().toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
      await finish();
    }, () => {
      setStatus('Could not get location. Please switch on Location in phone settings and try again.<br>लोकेशन नहीं मिली। फोन की सेटिंग में लोकेशन चालू करें।', 'err');
    }, { enableHighAccuracy: true, timeout: 20000 });
  });

  saveBtn.addEventListener('click', () => {
    if (!blob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = outName();
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    setStatus('<b>Saved ✔</b> Check your Downloads folder.<br>सेव हो गई। अपने Downloads फोल्डर में देखें।', 'ok');
  });

  shareBtn.addEventListener('click', async () => {
    if (!blob) return;
    try {
      await navigator.share({ files: [new File([blob], outName(), { type: 'image/jpeg' })] });
    } catch (e) { /* user cancelled */ }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
